<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>حفر ودفن · الإدارة</title>
<style>body{margin:0;background:#140c08;color:#f4ead6;font:15px/1.6 Tahoma,Arial,sans-serif}main{max-width:820px;margin:0 auto;padding:16px}h1{color:#f2d27a;font-size:22px}
input,button{font:inherit;border:0;border-radius:10px;padding:10px 12px}input{background:#f8f4e8;color:#1c120c;width:100%;box-sizing:border-box}
button{background:#e2bd5c;color:#2a1606;font-weight:bold}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;background:#2a1b13;color:#e9dcc2}.tabs button.on{background:#e2bd5c;color:#2a1606}
.it{background:#22140f;border:1px solid rgba(242,210,122,.25);border-radius:12px;padding:12px;margin:10px 0}.it small{opacity:.7;display:block}.it p{margin:6px 0;white-space:pre-wrap;word-break:break-word}.k{display:inline-block;border-radius:8px;padding:1px 8px;background:#3a2414;color:#f6d77e;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.box{background:#22140f;border:1px solid rgba(242,210,122,.25);border-radius:12px;padding:10px 12px}.box b{display:block;font-size:26px;color:#f6d77e;line-height:1.2}.box small{opacity:.75}
.live b{color:#5fd07a}h2{color:#f2d27a;font-size:17px;margin:18px 0 6px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid rgba(242,210,122,.15);text-align:center}th{color:#f2d27a;font-weight:normal}
.bar{height:8px;border-radius:4px;background:#e2bd5c;display:inline-block;vertical-align:middle}.err{background:#22140f;border:1px solid rgba(255,90,70,.3);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}.err b{color:#ff8a70}.err code{direction:ltr;display:block;opacity:.7;word-break:break-all}.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;background:#2a1b13;color:#e9dcc2;padding:7px}.seg button.on{background:#e2bd5c;color:#2a1606}</style></head><body><main>
<h1>حفر ودفن · الإدارة</h1>
<form id="f"><input id="key" type="password" placeholder="مفتاح الإدارة (ADMIN_KEY)" autocomplete="off"><div class="tabs"><button type="submit">افتح</button></div></form>
<div class="tabs" id="tabs" hidden><button type="button" data-t="stats" class="on">📊 الإحصائيات</button><button type="button" data-t="feedbacks">الاقتراحات والتواصل</button><button type="button" data-t="reports">البلاغات</button></div><div id="out"></div></main>
<script>
var key='',tab='stats',stT=0;var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var KIND={idea:'💡 اقتراح',bug:'🛠 مشكلة',contact:'✉️ تواصل'},WHY={cheat:'غش',abuse:'إساءة',spam:'إزعاج',name:'اسم غير لائق',other:'أخرى'};
function when(t){return new Date(t).toLocaleString('ar')}
function load(){if(tab==='stats')return stats();var out=document.getElementById('out');out.textContent='لحظة…';fetch('/api/so/'+tab,{headers:{'x-admin-key':key}}).then(function(r){return r.json()}).then(function(d){
 if(d.err){out.textContent='المفتاح غلط، أو ما انضاف ADMIN_KEY بإعدادات Render.';return}document.getElementById('tabs').hidden=false;
 if(!d.list.length){out.textContent='ما في شي للحين.';return}
 out.innerHTML='<p>العدد: '+d.n+'</p>'+d.list.map(function(x){return tab==='feedbacks'?
  '<div class="it"><span class="k">'+(KIND[x.kind]||x.kind)+'</span> <b>'+esc(x.name||'لاعب')+'</b><small>'+when(x.ts)+' · '+esc(x.ver||'')+' · '+esc(x.by)+'</small><p>'+esc(x.text)+'</p>'+(x.contact?'<small>للتواصل: '+esc(x.contact)+'</small>':'')+'<small dir="ltr">'+esc(x.ua||'')+'</small></div>':
  '<div class="it"><span class="k">'+esc(WHY[x.reason]||x.reason||'')+'</span> <b>'+esc(x.whoName||x.who)+'</b> ← بلّغ عنه '+esc(x.byName||x.by)+'<small>'+when(x.ts)+'</small><p>'+esc(x.note||'')+'</p><small dir="ltr">'+esc(JSON.stringify(x.ctx||{})).slice(0,900)+'</small></div>'}).join('')}).catch(function(){out.textContent='ما قدرنا نتصل.'})}

var span='today';
function N(n){return (n||0).toLocaleString('en')}
function stats(){var out=document.getElementById('out');clearTimeout(stT);fetch('/api/admin/stats',{headers:{'x-admin-key':key}}).then(function(r){return r.json()}).then(function(d){
 if(d.err){out.textContent='المفتاح غلط، أو ما انضاف ADMIN_KEY بإعدادات Render.';return}document.getElementById('tabs').hidden=false;if(tab!=='stats')return;
 var s=d[span],nw=d.now,dd=d.days.slice(0,14),mx=Math.max.apply(null,dd.map(function(x){return x.games}).concat([1]));
 var box=function(v,t,c){return '<div class="box '+(c||'')+'"><b>'+N(v)+'</b><small>'+t+'</small></div>'};
 var errs=function(l,t){return '<h2>'+t+' <small>(آخر ٧ أيام)</small></h2>'+(l.length?l.map(function(e){return '<div class="err"><b>×'+e.n+'</b> '+esc(e.msg)+'<code>'+esc(e.where||'')+'</code><small>آخر مرة: '+when(e.last)+(e.ver?' · '+esc(e.ver):'')+(e.dev?' · '+esc(e.dev):'')+'</small></div>'}).join(''):'<p>ما في أخطاء ✓</p>')};
 out.innerHTML='<h2>الحين <small>(يتحدث كل ٢٠ ثانية)</small></h2><div class="grid">'+box(nw.open,'فاتحين اللعبة','live')+box(nw.playingOnline,'يلعبون أونلاين','live')+box(nw.rooms,'غرف قاعدة تنلعب','live')+box(nw.waiting,'غرف تنتظر')+box(nw.watching,'يتفرجون')+'</div>'+
  '<div class="seg">'+[['today','اليوم'],['week','٧ أيام'],['month','٣٠ يوم']].map(function(x){return '<button type="button" data-span="'+x[0]+'" class="'+(span===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+
  '<div class="grid">'+box(s.games,'لعبة بدت')+box(s.online,'أونلاين')+box(s.offline,'ضد الكمبيوتر')+box(s.players,'جهاز مختلف فتح اللعبة')+box(s.newAcc,'لاعب جديد (أول مرة)')+box(s.fire,'ضغطة زر النار')+box(s.gifts,'هدية أونلاين')+box(s.spent,'روبية انصرفت')+box(s.cerr,'خطأ بالجوالات')+box(s.serr,'خطأ بالسيرفر')+'</div>'+
  '<h2>آخر ١٤ يوم</h2><div style="overflow-x:auto"><table style="min-width:620px"><tr><th>اليوم</th><th>ألعاب</th><th>أونلاين</th><th>كمبيوتر</th><th>خلصت</th><th>متوسط دقايق</th><th>لاعبين</th><th>أعلى بنفس الوقت</th><th>طلعوا/رجعوا</th><th>أخطاء</th></tr>'+
  dd.map(function(x){return '<tr><td>'+x.day.slice(5)+'</td><td style="text-align:start"><span class="bar" style="width:'+Math.round(x.games/mx*60)+'px"></span> '+x.games+'</td><td>'+x.online+'</td><td>'+x.offline+'</td><td>'+x.finished+'</td><td>'+(x.avgMin||'-')+'</td><td>'+x.players+'</td><td>'+x.peak+'</td><td>'+x.drops+'/'+x.back+'</td><td>'+(x.cerrN+x.serrN)+'</td></tr>'}).join('')+'</table></div>'+
  errs(d.errors.phone,'أخطاء الجوالات')+errs(d.errors.server,'أخطاء السيرفر')+'<p><small>آخر تحديث: '+when(d.at)+'</small></p>';
 stT=setTimeout(function(){if(tab==='stats')stats()},20000)}).catch(function(){out.textContent='ما قدرنا نتصل.'})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-span]');if(!b)return;span=b.dataset.span;stats()});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();key=document.getElementById('key').value.trim();load()});
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;[].forEach.call(document.querySelectorAll('[data-t]'),function(x){x.classList.toggle('on',x===b)});load()});
</script></body></html>
