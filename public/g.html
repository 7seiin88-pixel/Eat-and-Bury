<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>حفر ودفن</title></head>
<body style="margin:0;background:#2a0507;color:#f2d27a;font-family:sans-serif;display:grid;place-items:center;height:100vh;text-align:center"><p>لحظة…</p>
<script>
// Google sends the player back here after he signs in. What Google returned is kept for the game page, then the game opens. Nothing is sent anywhere from this page.
(function(){var q={};try{location.hash.slice(1).split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)q[p.slice(0,i)]=decodeURIComponent(p.slice(i+1))})}catch(e){}
try{if(q.id_token)localStorage.setItem('eb-gtok',q.id_token);else localStorage.setItem('eb-gerr',String(q.error||'nothing').slice(0,40))}catch(e){}
location.replace('/')})();
</script></body></html>
